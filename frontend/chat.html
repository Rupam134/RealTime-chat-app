<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Chatty</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">

    <div class="icon-rail">
      <div class="rail-avatar">👤</div>
      <div class="rail-icon">🏠</div>
      <div class="rail-icon active">💬</div>
      <div class="rail-icon">👥</div>
      <div class="rail-icon">📅</div>
      <div class="rail-icon">⚙</div>
    </div>

    <div class="conversations">
      <h1>Conversations</h1>

      <div class="tabs">
        <span class="tab active">• Latest</span>
        <span class="tab">Unread</span>
        <span class="tab">Favorites</span>
        <span class="tab">Archived</span>
      </div>

      <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="Search conversations">
      </div>

      <ul class="convo-list" id="contactList"></ul>
    </div>

    <div class="chat-window">

      <div class="chat-header">
        <div class="avatar">
          <span id="activeAvatar">👤</span>
          <span class="online-dot"></span>
        </div>
        <div class="header-info">
          <p class="header-status" id="activeStatus">Loading contacts…</p>
          <p class="header-name" id="activeName">ChatWave</p>
        </div>
        <div class="header-icons">
          <span>📞</span>
          <span>👤➕</span>
          <span>⋮</span>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="message-input">
        <span class="icon">😊</span>
        <input type="text" id="messageText" placeholder="Write your message here...">
        <span class="icon">📎</span>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>

    </div>

  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="chat.js"></script>
</body>

</html>
