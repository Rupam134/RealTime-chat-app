<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — ChatWave</title>
  <link rel="stylesheet" href="glass.css">
</head>
<body>

  <div class="glass-card">
    <h1>Welcome</h1>

    <form id="loginForm">
      <input type="email" id="username" placeholder="Email">
      <input type="password" id="password" placeholder="Password">

      <button type="submit" class="primary-btn">LOGIN</button>
    </form>

    <p id="message" style="color:#ffd6d6; font-size:13px; text-align:center; min-height:14px;"></p>
    
    <div class="links-row">
      <a href="#">Forgot Password?</a>
      <a href="index.html">Sign Up</a>
    </div>

    <p class="divider">OR LOGIN WITH</p>

    <div class="social-row">
      <div class="social-icon google">G</div>
      <div class="social-icon facebook">f</div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="authClient.js"></script>
</body>
</html>
